<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="600" height="380">
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="neonPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
  </defs>
  <rect width="600" height="380" fill="url(#bg1)" rx="16"/>
  <!-- Subtle Grid -->
  <g stroke="#334155" stroke-width="0.8" opacity="0.3">
    <line x1="0" y1="95" x2="600" y2="95"/>
    <line x1="0" y1="190" x2="600" y2="190"/>
    <line x1="0" y1="285" x2="600" y2="285"/>
    <line x1="150" y1="0" x2="150" y2="380"/>
    <line x1="300" y1="0" x2="300" y2="380"/>
    <line x1="450" y1="0" x2="450" y2="380"/>
  </g>
  <!-- Agent Nodes Network -->
  <g opacity="0.85">
    <!-- Connecting lines -->
    <path d="M 120 190 L 300 110 L 480 190 L 300 270 Z" fill="rgba(99, 102, 241, 0.08)" stroke="#6366f1" stroke-width="2" stroke-dasharray="6 4"/>
    <line x1="300" y1="110" x2="300" y2="270" stroke="#8b5cf6" stroke-width="2"/>
    <line x1="120" y1="190" x2="480" y2="190" stroke="#38bdf8" stroke-width="2"/>
    
    <!-- Central Node (Orchestrator) -->
    <circle cx="300" cy="190" r="38" fill="#1e1b4b" stroke="url(#neonPurple)" stroke-width="4"/>
    <circle cx="300" cy="190" r="14" fill="#a855f7"/>
    <text x="300" y="240" fill="#c084fc" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">MASTER AGENT</text>
    
    <!-- Left Node (Planner) -->
    <circle cx="120" cy="190" r="28" fill="#0f172a" stroke="url(#neonCyan)" stroke-width="3"/>
    <circle cx="120" cy="190" r="10" fill="#06b6d4"/>
    <text x="120" y="235" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">PLANNER</text>
    
    <!-- Top Node (Executor) -->
    <circle cx="300" cy="110" r="26" fill="#0f172a" stroke="#10b981" stroke-width="3"/>
    <circle cx="300" cy="110" r="9" fill="#10b981"/>
    <text x="300" y="75" fill="#34d399" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">EXECUTOR</text>

    <!-- Right Node (Critic / Eval) -->
    <circle cx="480" cy="190" r="28" fill="#0f172a" stroke="url(#neonPurple)" stroke-width="3"/>
    <circle cx="480" cy="190" r="10" fill="#ec4899"/>
    <text x="480" y="235" fill="#f472b6" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">EVALUATOR</text>

    <!-- Bottom Node (Memory) -->
    <circle cx="300" cy="270" r="26" fill="#0f172a" stroke="#f59e0b" stroke-width="3"/>
    <circle cx="300" cy="270" r="9" fill="#f59e0b"/>
    <text x="300" y="315" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">VECTOR MEMORY</text>
  </g>
  <rect x="20" y="20" width="160" height="28" rx="14" fill="rgba(99, 102, 241, 0.2)" stroke="#6366f1" stroke-width="1"/>
  <text x="100" y="38" fill="#e0e7ff" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">AI AGENT ARCHITECTURE</text>
</svg>

