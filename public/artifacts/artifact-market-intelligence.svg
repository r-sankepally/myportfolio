<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="600" height="380">
  <defs>
    <linearGradient id="bg6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#051923" />
      <stop offset="100%" stop-color="#003554" />
    </linearGradient>
    <linearGradient id="areaFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00a6fb" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#00a6fb" stop-opacity="0.0"/>
    </linearGradient>
  </defs>
  <rect width="600" height="380" fill="url(#bg6)" rx="16"/>
  
  <!-- Financial Chart & Candlesticks Mockup -->
  <g transform="translate(60, 50)">
    <!-- Header metrics -->
    <text x="0" y="25" fill="#ffffff" font-family="system-ui, sans-serif" font-size="20" font-weight="700">INDEX ALPHA</text>
    <text x="175" y="25" fill="#4ade80" font-family="system-ui, sans-serif" font-size="16" font-weight="600">+14.82% ▲</text>
    <text x="0" y="48" fill="#94a3b8" font-family="monospace" font-size="11">Real-time WebSocket feed | 25,000 events/sec</text>

    <!-- Candlesticks / Area line chart -->
    <g transform="translate(0, 80)">
      <!-- Grid -->
      <line x1="0" y1="0" x2="480" y2="0" stroke="#1e293b" stroke-width="1"/>
      <line x1="0" y1="50" x2="480" y2="50" stroke="#1e293b" stroke-width="1"/>
      <line x1="0" y1="100" x2="480" y2="100" stroke="#1e293b" stroke-width="1"/>
      <line x1="0" y1="150" x2="480" y2="150" stroke="#1e293b" stroke-width="1"/>

      <!-- Area fill under line -->
      <path d="M 0 130 Q 80 140 140 90 T 260 110 T 360 40 T 480 20 L 480 150 L 0 150 Z" fill="url(#areaFill)"/>
      <path d="M 0 130 Q 80 140 140 90 T 260 110 T 360 40 T 480 20" fill="none" stroke="#00a6fb" stroke-width="3"/>
      
      <!-- Highlight Pulse Point -->
      <circle cx="480" cy="20" r="7" fill="#00a6fb"/>
      <circle cx="480" cy="20" r="14" fill="#00a6fb" opacity="0.3"/>
    </g>

    <!-- Order book miniature bars -->
    <g transform="translate(0, 255)">
      <rect x="0" y="0" width="80" height="12" rx="3" fill="#10b981" opacity="0.7"/>
      <rect x="0" y="16" width="120" height="12" rx="3" fill="#10b981" opacity="0.85"/>
      <rect x="0" y="32" width="60" height="12" rx="3" fill="#10b981" opacity="0.6"/>

      <rect x="360" y="0" width="120" height="12" rx="3" fill="#ef4444" opacity="0.8"/>
      <rect x="380" y="16" width="100" height="12" rx="3" fill="#ef4444" opacity="0.7"/>
      <rect x="420" y="32" width="60" height="12" rx="3" fill="#ef4444" opacity="0.6"/>
    </g>
  </g>
</svg>

