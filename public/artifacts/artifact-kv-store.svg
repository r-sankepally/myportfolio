<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="600" height="380">
  <defs>
    <linearGradient id="bg4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#042f2e" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
  </defs>
  <rect width="600" height="380" fill="url(#bg4)" rx="16"/>
  
  <!-- Distributed Raft Cluster visualization -->
  <g transform="translate(150, 60)">
    <!-- Node 1 (Leader) -->
    <rect x="100" y="20" width="100" height="70" rx="8" fill="#134e4a" stroke="#2dd4bf" stroke-width="2"/>
    <text x="150" y="48" fill="#5eead4" font-family="monospace" font-size="12" font-weight="700" text-anchor="middle">NODE 1</text>
    <text x="150" y="68" fill="#ccfbf1" font-family="monospace" font-size="10" text-anchor="middle">[LEADER]</text>

    <!-- Node 2 (Follower) -->
    <rect x="0" y="150" width="100" height="70" rx="8" fill="#115e59" stroke="#14b8a6" stroke-width="1.5"/>
    <text x="50" y="178" fill="#5eead4" font-family="monospace" font-size="12" text-anchor="middle">NODE 2</text>
    <text x="50" y="198" fill="#99f6e4" font-family="monospace" font-size="10" text-anchor="middle">[FOLLOWER]</text>

    <!-- Node 3 (Follower) -->
    <rect x="200" y="150" width="100" height="70" rx="8" fill="#115e59" stroke="#14b8a6" stroke-width="1.5"/>
    <text x="250" y="178" fill="#5eead4" font-family="monospace" font-size="12" text-anchor="middle">NODE 3</text>
    <text x="250" y="198" fill="#99f6e4" font-family="monospace" font-size="10" text-anchor="middle">[FOLLOWER]</text>

    <!-- Heartbeat lines -->
    <line x1="120" y1="90" x2="60" y2="150" stroke="#2dd4bf" stroke-width="2" stroke-dasharray="4 4"/>
    <line x1="180" y1="90" x2="240" y2="150" stroke="#2dd4bf" stroke-width="2" stroke-dasharray="4 4"/>
    <line x1="100" y1="185" x2="200" y2="185" stroke="#14b8a6" stroke-width="1.5" stroke-dasharray="2 2"/>
  </g>

  <!-- Log replication stream -->
  <g transform="translate(60, 300)">
    <rect x="0" y="0" width="480" height="42" rx="6" fill="#0f2928" stroke="#134e4a" stroke-width="1"/>
    <rect x="10" y="8" width="65" height="26" rx="4" fill="#134e4a"/>
    <text x="42" y="25" fill="#5eead4" font-family="monospace" font-size="10" text-anchor="middle">Index 101</text>
    <rect x="85" y="8" width="65" height="26" rx="4" fill="#134e4a"/>
    <text x="117" y="25" fill="#5eead4" font-family="monospace" font-size="10" text-anchor="middle">Index 102</text>
    <rect x="160" y="8" width="65" height="26" rx="4" fill="#134e4a"/>
    <text x="192" y="25" fill="#5eead4" font-family="monospace" font-size="10" text-anchor="middle">Index 103</text>
    <rect x="235" y="8" width="85" height="26" rx="4" fill="#0d9488"/>
    <text x="277" y="25" fill="#ffffff" font-family="monospace" font-size="10" text-anchor="middle">COMMITTED</text>
    <text x="360" y="26" fill="#99f6e4" font-family="monospace" font-size="11">Raft Consensus Log</text>
  </g>
</svg>
