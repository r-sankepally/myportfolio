<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="600" height="380">
  <defs>
    <linearGradient id="bg5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#27272a" />
    </linearGradient>
  </defs>
  <rect width="600" height="380" fill="url(#bg5)" rx="16"/>
  
  <!-- Design System Components Showcase -->
  <g transform="translate(60, 50)">
    <!-- Button variants -->
    <rect x="0" y="0" width="130" height="42" rx="8" fill="#3b82f6"/>
    <text x="65" y="26" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Primary Button</text>

    <rect x="145" y="0" width="130" height="42" rx="8" fill="transparent" stroke="#71717a" stroke-width="1.5"/>
    <text x="210" y="26" fill="#e4e4e7" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Outline Variant</text>

    <rect x="290" y="0" width="130" height="42" rx="8" fill="rgba(168, 85, 247, 0.15)" stroke="#a855f7" stroke-width="1.5"/>
    <text x="355" y="26" fill="#c084fc" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Ghost Accent</text>

    <!-- Component Card preview -->
    <rect x="0" y="65" width="220" height="180" rx="12" fill="#27272a" stroke="#3f3f46" stroke-width="1"/>
    <circle cx="28" cy="95" r="14" fill="#3b82f6"/>
    <rect x="52" y="88" width="90" height="12" rx="4" fill="#71717a"/>
    <rect x="20" y="125" width="180" height="8" rx="4" fill="#3f3f46"/>
    <rect x="20" y="145" width="150" height="8" rx="4" fill="#3f3f46"/>
    <rect x="20" y="165" width="120" height="8" rx="4" fill="#3f3f46"/>
    <rect x="20" y="195" width="80" height="28" rx="6" fill="#10b981"/>
    <text x="60" y="213" fill="#ffffff" font-family="system-ui, sans-serif" font-size="10" font-weight="600" text-anchor="middle">Action</text>

    <!-- Color palette tokens -->
    <g transform="translate(245, 65)">
      <rect x="0" y="0" width="45" height="45" rx="8" fill="#3b82f6"/>
      <rect x="55" y="0" width="45" height="45" rx="8" fill="#8b5cf6"/>
      <rect x="110" y="0" width="45" height="45" rx="8" fill="#ec4899"/>
      <rect x="165" y="0" width="45" height="45" rx="8" fill="#10b981"/>
      <text x="0" y="70" fill="#a1a1aa" font-family="monospace" font-size="10">tokens.color.brand[500]</text>
      
      <!-- Input element -->
      <rect x="0" y="90" width="210" height="40" rx="8" fill="#18181b" stroke="#3b82f6" stroke-width="1.5"/>
      <text x="15" y="115" fill="#f4f4f5" font-family="system-ui, sans-serif" font-size="11">Input field with focus ring...</text>

      <!-- Badge group -->
      <g transform="translate(0, 145)">
        <rect x="0" y="0" width="60" height="24" rx="12" fill="#047857"/>
        <text x="30" y="16" fill="#a7f3d0" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Success</text>
        <rect x="68" y="0" width="60" height="24" rx="12" fill="#b45309"/>
        <text x="98" y="16" fill="#fde68a" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Warning</text>
        <rect x="136" y="0" width="60" height="24" rx="12" fill="#be123c"/>
        <text x="166" y="16" fill="#fecdd3" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Critical</text>
      </g>
    </g>
  </g>
</svg>
