<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1e38" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#8b5cf6" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.8" />
    </linearGradient>
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fed7aa" />
      <stop offset="100%" stop-color="#fbd38d" />
    </linearGradient>
    <linearGradient id="hairGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="jacketGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background circle with outer glowing border -->
  <rect width="400" height="400" rx="200" fill="url(#bgGrad)" />
  <circle cx="200" cy="200" r="195" fill="none" stroke="url(#glowGrad)" stroke-width="5" opacity="0.6"/>

  <!-- Geometric accent grid -->
  <g opacity="0.1" stroke="#ffffff" stroke-width="1">
    <line x1="50" y1="200" x2="350" y2="200" />
    <line x1="200" y1="50" x2="200" y2="350" />
    <circle cx="200" cy="200" r="140" fill="none" stroke-dasharray="4,4"/>
  </g>

  <!-- Avatar body / shoulders -->
  <g filter="url(#shadow)">
    <!-- Shoulders / Jacket -->
    <path d="M 90 380 C 95 300, 140 270, 200 270 C 260 270, 305 300, 310 380 Z" fill="url(#jacketGrad)" />
    <!-- Collar / Inner shirt -->
    <path d="M 170 270 L 200 320 L 230 270 Z" fill="#0f172a" />
    <polygon points="200,295 185,270 215,270" fill="#ffffff" opacity="0.9" />

    <!-- Neck -->
    <rect x="180" y="220" width="40" height="60" rx="10" fill="#fbd38d" />

    <!-- Head / Face -->
    <path d="M 140 180 C 140 120, 160 90, 200 90 C 240 90, 260 120, 260 180 C 260 235, 235 255, 200 255 C 165 255, 140 235, 140 180 Z" fill="url(#skinGrad)" />

    <!-- Modern stylish hair -->
    <path d="M 135 160 C 130 110, 160 70, 210 70 C 255 70, 270 100, 265 145 C 255 130, 240 125, 220 125 C 180 125, 165 145, 135 160 Z" fill="url(#hairGrad)" />

    <!-- Glasses frame for a smart tech look -->
    <g stroke="#38bdf8" stroke-width="4" fill="rgba(56, 189, 248, 0.15)">
      <!-- Left lens -->
      <rect x="152" y="160" width="38" height="28" rx="8" />
      <!-- Right lens -->
      <rect x="210" y="160" width="38" height="28" rx="8" />
      <!-- Bridge -->
      <line x1="190" y1="172" x2="210" y2="172" stroke-linecap="round"/>
      <!-- Temple arms -->
      <line x1="140" y1="170" x2="152" y2="170" stroke-linecap="round"/>
      <line x1="248" y1="170" x2="260" y2="170" stroke-linecap="round"/>
    </g>

    <!-- Eyes -->
    <circle cx="171" cy="174" r="4" fill="#0f172a" />
    <circle cx="229" cy="174" r="4" fill="#0f172a" />
    <circle cx="173" cy="172" r="1.5" fill="#ffffff" />
    <circle cx="231" cy="172" r="1.5" fill="#ffffff" />

    <!-- Eyebrows -->
    <path d="M 155 152 Q 170 148 185 152" stroke="#0f172a" stroke-width="3" stroke-linecap="round" fill="none" />
    <path d="M 215 152 Q 230 148 245 152" stroke="#0f172a" stroke-width="3" stroke-linecap="round" fill="none" />

    <!-- Nose -->
    <path d="M 200 180 L 196 198 L 204 198" stroke="#e2a76f" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />

    <!-- Confident Smile -->
    <path d="M 184 216 Q 200 228 216 216" stroke="#c2410c" stroke-width="3" stroke-linecap="round" fill="none" />
  </g>

  <!-- Modern developer tech badge overlay at bottom right -->
  <g transform="translate(270, 270)">
    <circle cx="25" cy="25" r="25" fill="#0f172a" stroke="#3b82f6" stroke-width="3" filter="url(#shadow)"/>
    <!-- Terminal / code icon -->
    <path d="M 17 20 L 23 25 L 17 30 M 26 30 L 33 30" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>
</svg>

